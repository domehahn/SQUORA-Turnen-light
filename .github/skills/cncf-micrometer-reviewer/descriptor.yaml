schema_version: "2"
name: cncf-micrometer-reviewer
version: 0.1.0
description: Review Micrometer using its official documentation and repository in the Observability and Analysis / Observability category. As an instrumentation facade, Micrometer allows you to instrument your code with dimensional metrics with a vendor-neutral interface and decide on the observability system as a last step. Instrumenting your core library code with Micrometer allows the libraries to be included in applications that ship data to different backends.
