schema_version: "2"
name: cncf-kubewarden-reviewer
version: 0.1.0
description: Review Kubewarden using its official documentation and repository in the Provisioning / Security & Compliance category. Kubewarden is a Policy Engine powered by WebAssembly policies. Its policies can be written in CEL, Rego (OPA & Gatekeeper flavours), Rust, Go, YAML, and others. Kubewarden simplifies Policy-As-Code by allowing policy authors and consumers to use their preferred tooling and stack, develop and test policies out of cluster.
