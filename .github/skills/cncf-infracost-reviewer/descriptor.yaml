schema_version: "2"
name: cncf-infracost-reviewer
version: 0.1.0
description: Review Infracost using its official documentation and repository in the Observability and Analysis / Continuous Optimization category. Infracost shows engineers how their code changes will impact cloud costs. It does this by sitting in the CI/CD workflow and on changing IaC code, leaves a comment like “This change will increase your next month bill by 20%” with a detailed breakdown of resources changed and their cost.
