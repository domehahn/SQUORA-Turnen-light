schema_version: "2"
name: cncf-yoke-reviewer
version: 0.1.0
description: Review yoke using its official documentation and repository in the App Definition and Development / Application Definition & Image Build category. Yoke is an IaC client-side package manager that deploys applications packaged as WASM executables, allowing users to leverage code to define their Applications instead of yaml templates. The yoke project includes a server-side component called the Air-Traffic-Controller allowing users to define their packages as CRDs and have them deployed natively server-side. Yoke is to helm and kro what pulumi is to terraform. Infrastructure as Code, but actually code.
