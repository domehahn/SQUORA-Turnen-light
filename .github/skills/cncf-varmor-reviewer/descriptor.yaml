schema_version: "2"
name: cncf-varmor-reviewer
version: 0.1.0
description: Review vArmor using its official documentation and repository in the Provisioning / Security & Compliance category. vArmor is a cloud-native container hardening system for Kubernetes. It leverages AppArmor, BPF LSM, Seccomp, and an Envoy-based NetworkProxy sidecar to enforce access control from system calls to application protocols. Its multi-enforcer architecture and built-in rules provide out-of-the-box protection for containers and AI Agent workloads without requiring deep security profile expertise.
