schema_version: "2"
name: cncf-containerssh-reviewer
version: 0.1.0
description: Review ContainerSSH using its official documentation and repository in the Provisioning / Security & Compliance category. ContainerSSH launches a new container for each SSH connection in Kubernetes, Podman or Docker. The user is transparently dropped in the container and the container is removed when the user disconnects. Authentication and container configuration are dynamic using webhooks, no system users required.
