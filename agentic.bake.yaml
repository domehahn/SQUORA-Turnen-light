version: "1"
variables:
    default_language: de
    governance_level: standard
    owner_team: platform-engineering
    project_name: SQUORA-Turnen-light
skill_sources:
    output_dir: .agents/skills
    defaults:
        initial_version: 0.1.0
        owner: platform-engineering
        license: MIT
        compatible_with:
            - claude-code
            - github-copilot
            - codex
    skills:
        - name: requirements-analyst
          description: Analyze requirements, user stories, acceptance criteria, constraints, risks, and open questions before implementation.
        - name: cost-based-planner
          description: Plan coding work with minimal context, relevant file selection, risk awareness, rollback, and validation strategy.
        - name: architecture-reviewer
          description: Review architecture, module boundaries, interfaces, coupling, scalability, data flows, and technical risks.
        - name: threat-modeler
          description: Identify assets, trust boundaries, abuse cases, attack paths, threats, and required security controls.
        - name: safe-implementer
          description: Create or modify code, tests, configuration, and project files safely with real file changes.
        - name: test-strategy-engineer
          description: Design and generate unit, integration, regression, security, and end-to-end test strategies.
        - name: verification-reviewer
          description: Review diffs, validate acceptance criteria, inspect test results, and find missed requirements.
        - name: security-reviewer
          description: Review code, CI/CD, configuration, permissions, dependencies, input validation, and DevSecOps risks.
        - name: secrets-reviewer
          description: Detect and prevent exposure of secrets, tokens, credentials, private keys, CI variables, and sensitive logs.
        - name: dependency-supply-chain-reviewer
          description: Review dependencies, lockfiles, package managers, container images, actions, and supply-chain risks.
        - name: ci-cd-reviewer
          description: Review CI/CD pipelines, runners, permissions, artifacts, caches, deployment gates, and token exposure.
        - name: iac-gitops-reviewer
          description: Review Terraform, Kubernetes, Helm, Kustomize, GitOps reconciliation, promotion, and environment safety.
        - name: compliance-governance-reviewer
          description: Review governance controls such as CODEOWNERS, branch protection, approvals, auditability, and policy compliance.
        - name: release-readiness-reviewer
          description: Assess release readiness, rollback, migrations, feature flags, monitoring, documentation, and breaking changes.
        - name: observability-reviewer
          description: Review logging, metrics, tracing, health checks, alerts, dashboards, runbooks, and operational readiness.
        - name: incident-postmortem-assistant
          description: Support incident analysis, timeline creation, root cause analysis, impact assessment, corrective actions, and follow-up issues.
        - name: documentation-maintainer
          description: Create and update README files, ADRs, setup guides, API docs, runbooks, and operational documentation.
        - name: universal-skill-creator
          description: Create, adapt, validate, and optimize reusable agent skills across agentic platforms.
        - name: dora-readiness-reviewer
          description: Review DORA readiness for ICT risk management, resilience testing, incidents, third-party risk, roles, policies, evidence, and auditability.
        - name: ict-risk-management-reviewer
          description: Review ICT risks, protection needs, criticality, controls, residual risks, treatment, and recurring reassessment.
        - name: ict-third-party-risk-reviewer
          description: Review cloud, SaaS, outsourcing, subcontractors, contracts, exit strategies, concentration risks, and DORA information-register readiness.
        - name: ict-incident-reporting-reviewer
          description: Review ICT incident classification, escalation, documentation, reportability, timelines, responsibilities, templates, and communication chains.
        - name: operational-resilience-tester
          description: Review backup and restore, failover, disaster recovery, restart procedures, crisis exercises, scenario tests, and lessons learned.
        - name: audit-evidence-reviewer
          description: Review evidence, approvals, tickets, logs, test protocols, risk decisions, versioning, and accountable owners.
        - name: control-mapping-reviewer
          description: Map technical measures to DORA, VAIT or BAIT migration needs, ISO 27001, BSI, internal policies, or MaRisk review expectations.
        - name: outsourcing-exit-strategy-reviewer
          description: Review exit plans, data return, provider transitions, emergency operations, suboutsourcing, cloud dependencies, and business impact.
        - name: documentation-governance-reviewer
          description: Review documentation freshness, ownership, review cycles, approvals, versioning, validity, and traceability.
        - name: runbook-playbook-maintainer
          description: Create and review runbooks, operating instructions, incident playbooks, escalation paths, restart procedures, and checklists.
        - name: architecture-decision-recorder
          description: Create and maintain ADRs with context, decisions, alternatives, risks, security impact, compliance relation, and review points.
        - name: audit-traceability-maintainer
          description: Link requirements, controls, implementation, tests, tickets, and evidence into an auditable trace.
        - name: policy-documentation-maintainer
          description: Create and update policies, standards, procedures, and control descriptions.
        - name: evidence-package-creator
          description: Create auditable evidence packages from tickets, pipeline results, test reports, approvals, scans, and architecture information.
        - name: devsecops-maturity-reviewer
          description: Assess maturity across plan, code, build, test, release, deploy, and operate with automation, security gates, ownership, and feedback loops.
        - name: pipeline-security-architect
          description: Design and review secure CI/CD pipelines with isolated runners, minimal rights, OIDC, signed artifacts, protected environments, and approval gates.
        - name: software-supply-chain-architect
          description: Review SLSA, provenance, SBOM, signatures, attestations, build integrity, artifact promotion, and trusted builders.
        - name: policy-as-code-engineer
          description: Create and review policies for OPA/Rego, Kyverno, GitLab Policies, Conftest, Checkov, Terraform, Kubernetes, and CI/CD gates.
        - name: secure-developer-platform-reviewer
          description: Review Internal Developer Platforms for secure golden paths, self-service guardrails, templates, permission models, secrets handling, and auditability.
        - name: vulnerability-management-coordinator
          description: Assess CVE triage, prioritization, SLAs, exploitability, asset criticality, exceptions, risk acceptance, and remediation tracking.
        - name: cloud-landing-zone-reviewer
          description: Review cloud accounts or subscriptions, networks, IAM, logging, policies, baselines, guardrails, encryption, tagging, and tenant separation.
        - name: cloud-governance-reviewer
          description: Review cloud naming, tags, ownership, cost centers, allowed services, regions, data classification, policy enforcement, and audit evidence.
        - name: finops-reviewer
          description: Review cloud costs, budgets, rightsizing, reserved or committed usage, anomalies, showback or chargeback, and team cost transparency.
        - name: sre-reliability-reviewer
          description: Assess SLOs, SLIs, error budgets, capacity, degradation, timeouts, retries, circuit breakers, load shedding, and operational risks.
        - name: kubernetes-platform-reviewer
          description: Review Kubernetes clusters, namespaces, RBAC, NetworkPolicies, Pod Security, admission controllers, resource limits, secrets, ingress, tenancy, and upgrades.
        - name: gitops-operations-reviewer
          description: Review Argo CD or Flux setups, sync policies, drift detection, promotion, rollback, app-of-apps, secrets, cluster access, and deployment governance.
        - name: aiops-signal-correlation-reviewer
          description: Assess correlation of logs, metrics, traces, events, and incidents to reduce noise, improve root-cause analysis, and lower alert fatigue.
        - name: alert-quality-reviewer
          description: Review alerts for actionability, clear symptoms, runbook links, severity, ownership, SLO relation, deduplication, escalation, and remediation suitability.
        - name: auto-remediation-reviewer
          description: Review automated repair actions for safe limits, dry runs, approval modes, rollback, audit logs, blast radius, and loop protection.
        - name: mlops-governance-reviewer
          description: Review model versioning, training data, bias, drift, monitoring, approvals, reproducibility, model registry, and deployment gates.
        - name: llmops-security-reviewer
          description: Review GenAI workloads for prompt injection, tool permissions, data exfiltration, RAG sources, sensitive prompt logging, evals, guardrails, and model access.
        - name: ai-change-risk-reviewer
          description: Review AI-assisted changes before execution for automation boundaries, human approval, affected-system criticality, and audit evidence.
        - name: agent-containment-reviewer
          description: Review agent sandboxes, transitive egress, privilege escalation, lateral movement, shared infrastructure, monitoring, and kill switches.
        - name: agent-runtime-enforcement-reviewer
          description: Compare declared agent contracts with independent runtime enforcement across tools, files, processes, networks, secrets, approvals, and limits.
        - name: agent-behavior-eval-engineer
          description: Design trajectory-level agent security evals for Goal compliance, contract boundaries, goal hacking, unsafe tools, and long-horizon behavior.
        - name: backdoor-persistence-reviewer
          description: Review changes for hidden privileged paths, triggers, covert egress, persistence, security-control tampering, and unexplained behavior.
        - name: agentic-threat-modeler
          description: Threat-model agents as untrusted principals across prompts, tools, MCP, memory, delegation, runtime infrastructure, and external systems.
        - name: security-invariant-test-engineer
          description: Derive negative tests and declarative evals from contract capabilities, tools, data flows, approvals, limits, and structured invariants.
        - name: privacy-data-protection-reviewer
          description: Review privacy, personal data, data classification, deletion concepts, purpose limitation, GDPR risks, and sensitive-data logging.
        - name: api-contract-reviewer
          description: Review REST, GraphQL, OpenAPI, and gRPC contracts, breaking changes, versioning, AuthN/AuthZ, error formats, and compatibility.
        - name: secure-design-reviewer
          description: Review secure-by-design decisions, least privilege, Zero Trust, tenant separation, secure defaults, and abuse scenarios.
        - name: policy-as-code-reviewer
          description: Review GitLab Security Policies, OPA/Rego, Kyverno, Conftest, Sentinel, admission policies, compliance pipelines, and central guardrails.
        - name: container-security-reviewer
          description: Review Dockerfiles, base images, user rights, capabilities, SBOM, image signing, distroless or slim images, CVEs, and runtime hardening.
        - name: identity-access-reviewer
          description: Review IAM, roles, service accounts, groups, tokens, OIDC federation, GitLab or GitHub permissions, cloud rights, and privilege-escalation paths.
        - name: risk-acceptance-reviewer
          description: Document and assess conscious risk decisions, impact and likelihood, expiry dates, and compensating measures.
        - name: secure-code-reviewer
          description: Review code vulnerabilities such as injection, path traversal, SSRF, XSS, deserialization, crypto misuse, and race conditions.
        - name: performance-scalability-reviewer
          description: Review load behavior, bottlenecks, caching, database access, queue behavior, scaling, timeouts, and resource limits.
        - name: migration-change-reviewer
          description: Review database migrations, schema changes, breaking changes, rollback ability, backward compatibility, and zero-downtime deployments.
        - name: sbom-vulnerability-management-reviewer
          description: Review SBOM generation, CVE triage, VEX, exception processes, patch SLAs, and the vulnerability lifecycle.
        - name: developer-experience-reviewer
          description: Review setup, local development, error messages, Makefiles or scripts, onboarding, tooling consistency, and practicality for teams.
        - name: resilience-reviewer
          description: Review timeouts, retries, circuit breakers, failover, backpressure, degraded modes, and resilience behavior.
        - name: backup-restore-reviewer
          description: Review restore tests, RPO/RTO, data integrity, backup protection, recoverability, and disaster recovery.
        - name: payment-integration-engineer
          description: Design and implement provider-neutral payment integrations with explicit state machines, idempotency, failure recovery, and auditable order linkage.
        - name: payment-security-reviewer
          description: Review payment data flows, tokenization, credential boundaries, PCI DSS scope, authorization, sensitive logging, and checkout abuse cases.
        - name: payment-webhook-reviewer
          description: Review payment webhooks for signature verification, replay and duplicate handling, ordering, durable processing, retries, and reconciliation.
        - name: payment-flow-tester
          description: Test authorization, capture, settlement, cancellation, refund, timeout, decline, authentication, webhook delay, and provider outage paths.
        - name: refund-dispute-handler
          description: Guide controlled refunds, reversals, chargebacks, and disputes with eligibility checks, evidence, deadlines, approval, and audit trails.
        - name: payment-reconciliation-reviewer
          description: Reconcile orders, provider transactions, fees, refunds, chargebacks, settlements, payouts, and ledger entries.
        - name: subscription-billing-engineer
          description: Design subscription billing for plans, trials, invoices, proration, usage, renewals, dunning, cancellation, and entitlements.
        - name: sca-3ds-reviewer
          description: Review Strong Customer Authentication and 3-D Secure challenge, exemption, liability, fallback, accessibility, and state handling.
        - name: payment-fraud-risk-reviewer
          description: Review payment fraud signals, velocity controls, risk rules, step-up actions, manual review, false positives, and feedback loops.
        - name: payment-observability-reviewer
          description: Review payment conversion, authorization, webhook, refund, reconciliation, latency, provider health, alerts, and privacy-safe telemetry.
        - name: payment-provider-migration-reviewer
