# API-Worker der Turnen-App: besitzt die D1-Datenbank und beantwortet
# /api/*-Requests. Kein eigenes öffentliches Routing - wird vom Web-Worker
# (siehe ../wrangler.toml) per Service Binding angesprochen.
name = "turnen-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "turnen"
database_id = "60c1750c-a2c9-4036-b217-1376ea80f216"
migrations_dir = "migrations"

[vars]
FRONTEND_URL = "https://squora.de/turnen-light"
# Absenderadresse für Benachrichtigungs-E-Mails. squora.de ist für Email
# Sending freigeschaltet - schlägt der Versand dennoch fehl, fängt
# worker/src/notifications.ts das ab und die Benachrichtigung bleibt
# zuverlässig im In-App-Postfach.
EMAIL_FROM_ADDRESS = "no_reply@squora.de"

# JWT_SECRET wird NICHT hier eingetragen, sondern per Secret gesetzt:
#   wrangler secret put JWT_SECRET

[[send_email]]
name = "EMAIL"

[observability]
enabled = true

[triggers]
# Täglich 8 Uhr UTC (9/10 Uhr MEZ/MESZ) - erinnert an seit >= 3 Tagen offene
# Verschiebe-/Kapazitäts-Anfragen, siehe scheduled() in src/index.ts.
crons = ["0 8 * * *"]
