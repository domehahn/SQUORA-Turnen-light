# API-Worker der Turnen-App: besitzt die D1-Datenbank und beantwortet
# /api/*-Requests. Kein eigenes öffentliches Routing - wird vom Web-Worker
# (siehe ../wrangler.toml) per Service Binding angesprochen.
name = "turnen-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
# War implizit true (kein workers_dev/keine routes gesetzt) - der API-Worker
# war dadurch direkt unter turnen-api.<account>.workers.dev erreichbar,
# unabhängig vom Web-Worker und dessen Security-Headern/CSP (externe
# Production-Readiness-Prüfung 2026-08-27). Service Bindings funktionieren
# unabhängig von workers_dev weiter - der Web-Worker kann diesen Worker
# also weiterhin ansprechen. preview_urls ebenfalls explizit aus (zweiter
# Durchgang derselben Prüfung) - aus Konsistenz mit dem Web-Worker, auch
# wenn der API-Worker ohnehin kein öffentliches Routing hat.
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "turnen-eu"
database_id = "da52e146-2dde-47d9-9747-9da8cda1cfdf"
migrations_dir = "migrations"

[vars]
FRONTEND_URL = "https://squora.de/turnen-light"
# Absenderadresse für Benachrichtigungs-E-Mails. squora.de ist für Email
# Sending freigeschaltet - schlägt der Versand dennoch fehl, fängt
# worker/src/notifications.ts das ab und die Benachrichtigung bleibt
# zuverlässig im In-App-Postfach.
EMAIL_FROM_ADDRESS = "no_reply@squora.de"

# Speicherbegrenzung für archivierte (ausgetretene) Kinder (Finding PRIV-05,
# Art. 5(1)(e) DSGVO) - der tägliche Cron-Job löscht sie endgültig, sobald
# sie seit mindestens dieser Anzahl Tage archiviert sind. Frist per
# Nutzerentscheidung (2026-08-27) auf 1095 Tage (3 Jahre) festgelegt, nicht
# von Claude eigenmächtig gewählt - siehe PRIVACY_SECURITY_GAP_ANALYSIS.md,
# PRIV-05.
ARCHIVED_CHILD_RETENTION_DAYS = "1095"

# Aufbewahrungsdauer für Security-Tabellen (sessions, login_attempts,
# used_password_reset_tokens) - täglicher Cleanup-Job löscht Einträge, die
# älter als diese Anzahl Tage sind (abgelaufene/widerrufene Sessions sofort,
# unabhängig von dieser Frist). Wert per Nutzerentscheidung (2026-08-27).
SECURITY_LOG_RETENTION_DAYS = "90"

# JWT_SECRET wird NICHT hier eingetragen, sondern per Secret gesetzt:
#   wrangler secret put JWT_SECRET

[[send_email]]
name = "EMAIL"

[observability]
enabled = true

[triggers]
# Täglich 8 Uhr UTC (9/10 Uhr MEZ/MESZ) - erinnert an seit >= 3 Tagen offene
# Verschiebe-/Kapazitäts-Anfragen, siehe scheduled() in src/index.ts.
crons = ["0 8 * * *"]
